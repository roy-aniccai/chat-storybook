<script>
'use strict';
// A paper-cut, stop-motion storybook drawn on one canvas. Poses are held on twos (12/s),
// the camera and page turns run on ones (24/s). Everything is a pure function of time.
const W=1080,H=1920,DUR=66,TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const og=off.getContext('2d');
const P=D.people,N=P.length,CP=D.copy,TL=D.titleLines,GAP=D.gap,RTL=!!D.rtl,DIR=RTL?'rtl':'ltr',MIR=RTL?1:-1,FF=D.font;
const COL=['#4a8fcb','#ea7c9c','#58b46f','#f2ab3c','#9273cc','#e8644f','#3bb7a6'];
// left-to-right languages are drawn in a mirrored world, and every string is flipped back as it is drawn
let FL=0;
{const ft=g.fillText.bind(g);g.fillText=(s,x,y)=>{if(!FL){ft(s,x,y);return}const a=g.textAlign;g.save();g.translate(x,y);g.scale(-1,1);g.textAlign=a==='left'?'right':a==='right'?'left':a;ft(s,0,0);g.restore()}}
const subs=(ts,l)=>l?ts.map((t,i)=>[t,l[i]]).filter(s=>s[1]!=null):null;
const INK='#3b2a22',CREAM='#f5e9d2',WHITE='#fffaf0',KRAFT='#c8a273',YEL='#ffd24a',TEAL='#2d6e76',TAPE='#ecdcb4';
const ON=['#fffaf0','#fffaf0','#fffaf0',INK,'#fffaf0','#fffaf0','#fffaf0'];
const TOP1=358,TOP2=476,SUBY=1578;
const fmt=n=>Number(n).toLocaleString('en-US');
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t,seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hash(n){n=Math.imul((n|0)^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return(n>>>0)/4294967296}
const h2=(a,b)=>hash(Math.imul(a|0,7919)+Math.imul(b|0,104729)+13);
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=hex(a),y=hex(b);return'rgb('+x.map((v,i)=>Math.round(lerp(v,y[i],clamp(t)))).join(',')+')'};
const tint=(c,t)=>mix(c,'#ffffff',t),shade=(c,t)=>mix(c,'#000000',t);
let T=0,TP=0,BI=0;                       // smooth time, pose time (on twos), boil index
const q=t=>Math.floor(t*12+1e-6)/12;
const pk=a=>Math.floor((TP-a)*12+1e-6);  // poses elapsed since a
const POP=[.45,1.18,.93,1.03,1],pop=k=>k<0?0:POP[Math.min(k,4)];
const bo=(id,a=1)=>[(h2(id,BI)-.5)*1.7*a,(h2(id+500,BI)-.5)*1.7*a,(h2(id+900,BI)-.5)*.014*a];

// ───────── paper
let GR,VIG;
function makeGrain(seed){
  const r=rng(seed),mk=n=>{
    const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n);
    for(let i=0;i<n*n;i++){const v=128+(r()-.5)*112;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255}
    x.putImageData(im,0,0);return c;
  };
  const o=document.createElement('canvas');o.width=o.height=384;const y=o.getContext('2d');
  y.drawImage(mk(96),0,0,384,384);            // soft mottling
  y.globalAlpha=.6;y.drawImage(mk(384),0,0);  // fine tooth
  y.globalAlpha=1;
  for(let i=0;i<210;i++){
    const px=r()*384,py=r()*384,a=r()*TAU,l=8+r()*26;
    y.strokeStyle=r()<.55?'rgba(255,255,255,.28)':'rgba(40,40,40,.2)';y.lineWidth=.7+r()*.7;
    y.beginPath();y.moveTo(px,py);
    y.quadraticCurveTo(px+Math.cos(a)*l*.5+(r()-.5)*8,py+Math.sin(a)*l*.5+(r()-.5)*8,px+Math.cos(a)*l,py+Math.sin(a)*l);y.stroke();
  }
  return o;
}
// one cut piece: drop shadow, fill, grain, and a light edge on the side facing the lamp
function paper(p,fill,o={}){
  const z=o.z??1;
  g.save();
  if(o.sh!==0){g.shadowColor='rgba(50,30,12,'+(o.sa??.32)+')';g.shadowBlur=9*z+2;g.shadowOffsetX=3*z;g.shadowOffsetY=5*z+1}
  g.fillStyle=fill;g.fill(p);
  g.restore();
  g.save();g.clip(p);
  g.globalCompositeOperation='overlay';g.globalAlpha=o.gr??.5;g.fillStyle=GR;g.fillRect(-3000,-3000,6000,6000);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  if(o.edge!==0){g.translate(FL?-1.2:1.2,1.6);g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.6;g.stroke(p)}
  g.restore();
}
function smooth(pts){
  const p=new Path2D(),n=pts.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],s=m(pts[n-1],pts[0]);
  p.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const c=pts[i],e=m(c,pts[(i+1)%n]);p.quadraticCurveTo(c[0],c[1],e[0],e[1])}
  p.closePath();return p;
}
function blob(rx,ry,seed,n=16,amp=.045){
  const pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=1+(h2(seed,i)-.5)*2*amp;pts.push([Math.cos(a)*rx*k,Math.sin(a)*ry*k])}
  return smooth(pts);
}
function rpoly(c,r){
  const n=c.length,p=new Path2D();p.moveTo((c[0][0]+c[1][0])/2,(c[0][1]+c[1][1])/2);
  for(let i=1;i<=n;i++){const a=c[i%n],b=c[(i+1)%n];p.arcTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2,r)}
  p.closePath();return p;
}
function rrect(w,h,r,seed=0,j=2.5){
  return rpoly([[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map((c,i)=>[c[0]+(h2(seed,i)-.5)*2*j,c[1]+(h2(seed,i+9)-.5)*2*j]),Math.min(r,w/2,h/2));
}
function poly(pts,seed=0,j=0){
  const p=new Path2D();
  pts.forEach((c,i)=>{const x=c[0]+(h2(seed,i*2)-.5)*2*j,y=c[1]+(h2(seed,i*2+1)-.5)*2*j;i?p.lineTo(x,y):p.moveTo(x,y)});
  p.closePath();return p;
}
function band(y,seed,amp=7){
  const pts=[[-30,H+40],[-30,y]];
  for(let x=0;x<=W+60;x+=60)pts.push([x,y+(h2(seed,x)-.5)*2*amp]);
  pts.push([W+30,H+40]);return poly(pts);
}
function page(col,o={}){
  g.fillStyle=col;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='overlay';g.globalAlpha=o.gr??.5;g.scale(1.35,1.35);g.fillStyle=GR;g.fillRect(0,0,W,H);g.restore();
}

// ───────── type
function font(size,wt=800){g.font=wt+' '+size+'px '+FF}
function fit(txt,size,wt,maxW){font(size,wt);const w=g.measureText(txt).width;if(w>maxW){size=Math.max(12,Math.floor(size*maxW/w));font(size,wt)}return size}
function layout(tokens,size,wt){
  font(size,wt);const sp=size*.26;let w=0;
  const it=tokens.map((tk,k)=>{
    const s=typeof tk==='string'?{t:tk}:tk,chip=s.n!=null,txt=chip?String(s.n):s.t;
    const tw=g.measureText(txt).width,iw=chip?tw+size*.42:tw,gap=(k>0&&!s.j)?sp:0;
    w+=gap+iw;return{txt,chip,iw,gap,c:s.c};
  });
  return{it,w};
}
// tokens are laid in reading order (right to left here; the mirrored world turns that around); numbers ride on a paper chip
function drawTokens(L,size,ink,seed,wt){
  font(size,wt);g.textBaseline='alphabetic';let x=L.w/2;const by=size*.345;
  L.it.forEach((s,k)=>{
    x-=s.gap;
    if(s.chip){
      g.save();g.translate(x-s.iw/2,0);g.rotate((h2(seed,k+40)-.5)*.07);
      paper(rrect(s.iw,size*1.16,size*.2,seed+k,2),s.c||YEL,{z:.5});
      g.direction='ltr';g.textAlign='center';g.fillStyle=INK;font(size*.98,wt);g.fillText(s.txt,0,by);
      g.restore();font(size,wt);
    }else{g.direction=DIR;g.textAlign='right';g.fillStyle=ink;g.fillText(s.txt,x,by)}
    x-=s.iw;
  });
}
function strip(tokens,cx,cy,o={}){
  const k=o.k??9;if(k<0)return;
  let size=o.size||66,L=layout(tokens,size,o.wt);const maxW=o.maxW||980;
  if(L.w+size*1.1>maxW){size=Math.floor(size*(maxW-size*1.1)/L.w);L=layout(tokens,size,o.wt)}
  const seed=o.seed||1,w=L.w+size*1.1,h=size*1.6,kk=Math.min(k,3),dir=h2(seed,2)<.5?-1:1;
  let sc=[1.2,.96,1.02,1][kk],rot=(h2(seed,1)-.5)*.04+[.07,-.012,.004,0][kk]*dir,z=[3.2,.7,1,1][kk];
  if(o.lift){sc=1.07;rot+=.05*dir;z=3}
  g.save();g.translate(cx,cy);const b=bo(seed+300,.6);g.translate(b[0],b[1]);g.rotate(rot+b[2]*.4);g.scale(sc,sc);
  paper(rrect(w,h,7,seed,3.5),o.col||WHITE,{z});

}
function caps(list){
  list.forEach((c,i)=>{
    if(TP>=c.b-1e-6)return;const k=pk(c.a);if(k<0)return;
    strip(c.tk,540,c.y,{k,size:c.size,col:c.col,ink:c.ink,seed:c.seed||(i*17+3),lift:TP>=c.b-1/12-1e-6,maxW:c.maxW});
  });
}
// a second language can run as a subtitle on a strip of masking tape
function subtitle(list){
  if(!list)return;
  let text=null;for(const s of list)if(TP>=s[0]-1e-6)text=s[1];
  if(!text)return;
  let size=36;font(size,600);let w=g.measureText(text).width;
  if(w>900){size=Math.max(24,Math.floor(size*900/w));font(size,600);w=g.measureText(text).width}
  const tw=w+80,th=64,n=5,p=new Path2D();
  p.moveTo(-tw/2,-th/2);p.lineTo(tw/2,-th/2);
  for(let i=0;i<n;i++)p.lineTo(tw/2+(i%2?0:7),-th/2+(i+.5)*th/n);
  p.lineTo(tw/2,th/2);p.lineTo(-tw/2,th/2);
  for(let i=n-1;i>=0;i--)p.lineTo(-tw/2-(i%2?0:7),-th/2+(i+.5)*th/n);
  p.closePath();
  g.save();g.translate(540,SUBY);g.rotate(-.006);
  paper(p,TAPE,{z:.5,sa:.26,gr:.4});
  g.direction='ltr';g.textAlign='center';g.textBaseline='alphabetic';g.fillStyle='rgba(59,42,34,.94)';font(size,600);g.fillText(text,0,size*.345);
  g.restore();
}
function tag(text,x,y,o={}){
  const size=o.maxW?fit(text,o.size||32,o.wt||700,o.maxW-(o.size||32)*.9):o.size||32;font(size,o.wt||700);
  const w=g.measureText(text).width+size*.9,h=size*1.5,s=o.sc??1;if(s<=0)return w;
  g.save();g.translate(x,y);g.rotate(o.rot||0);g.scale(s,s);
  paper(rrect(w,h,6,o.seed||5,2),o.col||WHITE,{z:o.z??.6});
  g.direction=o.ltr?'ltr':DIR;g.textAlign='center';g.textBaseline='alphabetic';g.fillStyle=o.ink||INK;g.fillText(text,0,size*.35);
  g.restore();return w;
}
function titleTiles(lines,cx,cy,t0,o={}){
  const hh=o.h||84,gapY=o.gapY||104;let idx=0;
  lines.forEach((ln,r)=>{
    const ch=[...ln],n=ch.length,pitch=Math.min(o.pitch||68,(o.maxW||410)/n),w=pitch-6;
    ch.forEach((c,j)=>{
      const k=pk(t0+idx*.06);idx++;if(k<0||c===' ')return;
      const sd=r*31+j,ci=(sd*3+r)%7;
      g.save();g.translate(cx+(n-1)/2*pitch-j*pitch,cy+r*gapY+(h2(sd,3)-.5)*8);g.rotate((h2(sd,4)-.5)*.16);
      const s=pop(k);g.scale(s,s);
      paper(rrect(w,hh,8,sd+70,2.5),COL[ci],{z:.5});
      g.direction=DIR;g.textAlign='center';g.textBaseline='alphabetic';font(Math.min(hh*.72,w*1.2),900);g.fillStyle=ON[ci];g.fillText(c,0,hh*.25);
      g.restore();
    });
  });
}

// ───────── the friends (up to seven)
const BODY=[],FACE=[];
function initChars(){
  BODY[0]=rpoly([[-52,-190],[52,-190],[52,0],[-52,0]].map((p,i)=>[p[0]+(h2(11,i)-.5)*5,p[1]+(h2(12,i)-.5)*5]),48);FACE[0]={ey:-128,dx:21,sh:50};
  BODY[1]=(()=>{const a=[];for(let i=0;i<16;i++){const t=i/16*TAU,k=1+(h2(21,i)-.5)*.07;a.push([Math.cos(t)*68*k,-66+Math.sin(t)*66*k])}return smooth(a)})();FACE[1]={ey:-76,dx:24,sh:64};
  BODY[2]=rpoly([[3,-176],[84,0],[-82,0]],28);FACE[2]={ey:-60,dx:22,sh:52};
  BODY[3]=(()=>{const p=new Path2D();p.moveTo(-58,0);p.quadraticCurveTo(-84,0,-82,-30);p.bezierCurveTo(-78,-190,78,-190,82,-30);p.quadraticCurveTo(84,0,58,0);p.closePath();return p})();FACE[3]={ey:-80,dx:26,sh:76};
  BODY[4]=rpoly(Array.from({length:6},(_,i)=>{const t=i/6*TAU;return[Math.cos(t)*82+(h2(41,i)-.5)*5,-74+Math.sin(t)*80]}),16);FACE[4]={ey:-84,dx:25,sh:74};
  BODY[5]=(()=>{const a=[];for(let i=0;i<16;i++){const t=i/16*TAU,k=(1+.2*Math.sin(t))*(1+(h2(51,i)-.5)*.05);a.push([Math.cos(t)*64*k,-84+Math.sin(t)*84])}return smooth(a)})();FACE[5]={ey:-68,dx:23,sh:70};
  BODY[6]=(()=>{const a=[];for(let i=0;i<10;i++){const t=i/10*TAU-TAU/4,r=i%2?60:88;a.push([Math.cos(t)*r,-76+Math.sin(t)*r])}return smooth(a)})();FACE[6]={ey:-76,dx:21,sh:58};
}
const blinks=i=>((TP+i*.77)%3.1)<.17;
const talk=i=>h2(i+50,Math.floor(TP*6+1e-6))<.5?'open':'smile';
// (x,y) is the point on the ground between the feet
function drawChar(i,x,y,o={}){
  const s=o.s??1;if(s<=0)return;
  const L=o.legs===0?0:30,f=FACE[i],mood=o.mood||'smile',lk=o.look||[0,0],b=bo(100+i,o.still?0:1);
  g.save();g.translate(x+b[0],y+b[1]);g.scale(s,s);
  if(L){
    for(const sd of[-1,1]){
      const sw=o.walk!=null?Math.sin(o.walk+(sd>0?0:Math.PI))*9:0;
      g.strokeStyle=INK;g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(sd*19,-L-8);g.lineTo(sd*19+sw,-4);g.stroke();
      g.fillStyle=INK;g.beginPath();g.ellipse(sd*19+sw+sd*5,-3,11,6,0,0,TAU);g.fill();
    }
  }
  g.translate(0,-L);g.rotate((o.rot||0)+b[2]);g.scale(1+(o.sq||0),1-(o.sq||0));
  const arms=o.arms||[.3,.3];
  [-1,1].forEach((sd,k)=>{
    const a=arms[k],sx=sd*f.sh*.92,sy=f.ey+26,ex=sx+Math.sin(a)*sd*36,ey=sy+Math.cos(a)*36;
    g.strokeStyle=INK;g.lineWidth=6.5;g.lineCap='round';g.beginPath();g.moveTo(sx-sd*8,sy);g.lineTo(ex,ey);g.stroke();
    g.fillStyle=INK;g.beginPath();g.arc(ex,ey,6.5,0,TAU);g.fill();
  });
  paper(BODY[i],COL[i],{z:o.z??1});
  const closed=o.blink||mood==='sleep'||mood==='laugh'||(o.blink!==false&&blinks(i));
  for(const sd of[-1,1]){
    const ex=sd*f.dx;
    if(closed){
      g.strokeStyle=INK;g.lineWidth=4.5;g.lineCap='round';g.beginPath();
      if(mood==='laugh')g.arc(ex,f.ey+5,10,Math.PI*1.15,Math.PI*1.85);
      else if(mood==='sleep')g.arc(ex,f.ey-6,10,Math.PI*.15,Math.PI*.85);
      else{g.moveTo(ex-9,f.ey);g.lineTo(ex+9,f.ey)}
      g.stroke();
    }else{
      g.fillStyle='rgba(40,25,10,.18)';g.beginPath();g.arc(ex+1.5,f.ey+2.5,15,0,TAU);g.fill();
      g.fillStyle='#fffdf6';g.beginPath();g.arc(ex,f.ey,15,0,TAU);g.fill();
      g.fillStyle=INK;g.beginPath();g.arc(ex+lk[0]*6,f.ey+lk[1]*6,6.8,0,TAU);g.fill();
    }
  }
  g.fillStyle='rgba(255,110,110,.3)';
  for(const sd of[-1,1]){g.beginPath();g.arc(sd*(f.dx+17),f.ey+19,8,0,TAU);g.fill()}
  const my=f.ey+27;g.strokeStyle=INK;g.fillStyle=INK;g.lineWidth=4.5;g.lineCap='round';g.beginPath();
  if(mood==='open'||mood==='laugh'){
    const r=mood==='laugh'?15:11;g.arc(0,my-5,r,0,Math.PI);g.closePath();g.fill();
    g.fillStyle='#f39090';g.beginPath();g.ellipse(0,my-5+r*.62,r*.48,r*.28,0,0,TAU);g.fill();
  }else if(mood==='o'){g.arc(0,my,6,0,TAU);g.fill()}
  else if(mood==='sleep'){g.arc(0,my,4,0,TAU);g.fill()}
  else{g.arc(0,my-9,13,Math.PI*.18,Math.PI*.82);g.stroke()}

}
function bubble(b,s){
  if(s<=0)return;
  g.save();g.translate(b.x,b.y);g.rotate(b.rot);g.scale(s,s);
  const w=b.w,h=b.h,sx=b.fl?-1:1,col=tint(COL[b.c],.1),tl=new Path2D();
  tl.moveTo(sx*w*.2,h*.36);tl.lineTo(sx*w*.42,h*.9);tl.lineTo(sx*w*.02,h*.42);tl.closePath();
  paper(tl,col,{z:.5,edge:0});paper(rrect(w,h,h*.38,b.seed,1.5),col,{z:.5});
  const lw=w-34;g.fillStyle='rgba(255,255,255,.82)';g.fillRect(-lw/2,-h*.2,lw,6);g.fillRect(lw/2-lw*.6,h*.07,lw*.6,6);
  g.restore();
}
function orb(x,y,kind){
  g.save();g.translate(x,y);
  if(kind==='sun'){
    g.save();g.rotate(Math.floor(TP*4+1e-6)*.09);
    for(let i=0;i<12;i++){g.save();g.rotate(i/12*TAU);g.translate(88,0);paper(poly([[-14,-12],[20,0],[-14,12]],600+i,1.5),'#ffc23d',{z:.4,edge:0});g.restore()}
    g.restore();paper(blob(62,62,601,16,.03),'#ffd24a',{z:.8});
  }else{
    paper(blob(54,54,602,16,.03),'#f7efcf',{z:.8});
    g.fillStyle='rgba(120,110,80,.2)';[[-16,-12,11],[18,8,8],[-4,22,6]].forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2],0,TAU);g.fill()});
  }
  g.restore();
}
function cloud(x,y,s,seed){
  const p=new Path2D();[[-70,10,46],[-18,-22,58],[44,-6,50],[92,16,36],[10,24,52]].forEach(c=>{p.moveTo(c[0]+c[2],c[1]);p.arc(c[0],c[1],c[2],0,TAU)});
  g.save();g.translate(x,y);g.scale(s,s);paper(p,'#fffdf8',{z:1.2,edge:0,sa:.2});g.restore();
}
function starPath(r){const a=[];for(let i=0;i<10;i++){const t=i/10*TAU-TAU/4,rr=i%2?r*.45:r;a.push([Math.cos(t)*rr,Math.sin(t)*rr])}return poly(a)}

// ───────── scene 0: the desk, a phone, a book
const HK={swap:2.5,c:3,zoom0:4.6,zoom1:5.5,bx:540,by:1105};
const HB=(()=>{
  const r=rng(77),a=[];let k=0;

    pageTurn(ease((kt+1)/7));
  }else drawScene(i);
  const f=(h2(BI,4242)-.5)*.026;g.fillStyle=f>0?'rgba(255,250,235,'+f+')':'rgba(30,15,0,'+(-f)+')';g.fillRect(0,0,W,H);
  g.fillStyle=VIG;g.fillRect(0,0,W,H);
}

// ───────── sound cues, read by the soundtrack builder
const CUES=[];
const cue=(t,k,v)=>CUES.push({t:Math.round(t*1000)/1000,k,v});
[C0,C1,C2,C3,C4,C5,C6].forEach(l=>l.forEach(c=>{if(c.a>=0)cue(c.a,'slap')}));
SC.slice(0,-1).forEach(s=>cue(s.t1-.5,'page'));
HB.forEach((b,i)=>{if(b.t>0&&i%2===0)cue(b.t,'bub',i)});
cue(HK.swap,'tada');cue(HK.c,'roll',.9);
for(let i=0;i<N;i++)cue(S1.pop(i),'pop',i);
cue(S1.bub,'chatter',2);cue(13,'crown');cue(S1.st0,'stack',S1.st1-S1.st0);
P.forEach((p,i)=>cue(S1.st0+SHN[i]/SHN[0]*(S1.st1-S1.st0),'ding',i));
cue(CK.h0,'clock',CK.h1-CK.h0);cue(CK.flag,'flag');cue(CK.rew,'spin');
if(GAP){cue(YR.rip,'rip');cue(YR.tape,'tape')}cue(YR.flag,'flag');cue(YR.end,'cheer');
D.pairs.forEach((p,k)=>cue(YN.y0+k*(YN.y1-YN.y0)/NP,'yarn',k));
for(let n=0;n<9;n++)cue(YN.bead+n*.5,'bead',n%2);
for(let k=0;k<NB;k++)cue(WD.b0+k*.25,'book',k);
cue(WD.flag,'flag');cue(WD.l3,'laugh',4);
cue(52,'cheer');cue(53.5,'typing',2.4);
cue(CT.t,'slap');CT.s.forEach((t,j)=>cue(t,'card',j));cue(CT.p,'slap');cue(CT.c,'slap');cue(CT.c+.35,'end');
CUES.sort((a,b)=>a.t-b.t);

window.DURATION=DUR;window.CUES=CUES;window.SCENES=SC.map(s=>({id:s.id,t0:s.t0,t1:s.t1}));
window.seek=t=>render(t);
window.READY=document.fonts.load('800 60px '+FF,'אבג Claude 123').then(()=>document.fonts.ready).then(()=>{
  GR=g.createPattern(makeGrain(7),'repeat');
  VIG=g.createRadialGradient(540,960,560,540,960,1180);VIG.addColorStop(0,'rgba(40,20,0,0)');VIG.addColorStop(1,'rgba(40,20,0,.2)');
  initChars();render(0);
  if(!/capture=1/.test(location.search)){
    cv.style.cssText='block-size:100vh;inline-size:auto';
    const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)})();
  }
});
</script>
